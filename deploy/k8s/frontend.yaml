apiVersion: apps/v1
kind: Deployment
metadata:
  name: pickfit-fe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pickfit-fe
  template:
    metadata:
      labels:
        app: pickfit-fe
        tags.datadoghq.com/service: pickfit-fe
    spec:
      containers:
        - name: web
          image: ghcr.io/pickfit-ai/pickfit-fe:develop
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: pickfit-fe
spec:
  selector:
    app: pickfit-fe
  ports:
    - port: 8081
      targetPort: 8081
